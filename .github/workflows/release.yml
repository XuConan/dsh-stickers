name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 install.bat（GBK + CRLF）
        run: python dsh-stickers/scripts/make_install_bat.py

      - name: 打便携包
        run: python dsh-stickers/scripts/build-dist.py

      - name: 校验产物
        run: python dsh-stickers/scripts/verify_dist.py

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-stickers/dist/dsh-stickers-portable.zip
          overwrite: true
          generate_release_notes: true
